[project]
name = "annotation-qc"
version = "0.1.0"
description = "Small reproducible image annotation and quality-control pipeline for Computer Vision datasets."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Toan Nguyen" }]
dependencies = [
    "pillow>=11.0",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/annotation_qc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
