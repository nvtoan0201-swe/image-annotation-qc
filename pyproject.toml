[project]
name = "annotation-qc"
version = "0.1.0"
description = "Small reproducible image annotation and quality-control pipeline for Computer Vision datasets."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Toan Nguyen" }]
dependencies = [
    "pillow>=11.0",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
# Optional: model-assisted pre-annotation (pretrained YOLO).
# Install with: uv sync --group preannotate
preannotate = [
    "ultralytics>=8.3",
    "torch>=2.6",
    "torchvision>=0.21",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/annotation_qc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
